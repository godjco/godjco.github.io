<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수식 신호등</title>
<style>
:root{color-scheme:light;--ink:#20263a;--muted:#7b8190;--red:#f07075;--yellow:#f2c85c;--green:#67bf8d}*{box-sizing:border-box}body{margin:0;background:#f6f5f4;color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}.shell{width:min(100%,580px);margin:auto;padding:24px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.eyebrow{font-size:.7rem;letter-spacing:.16em;font-weight:850;color:#af6767}.title{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;letter-spacing:-.05em;margin:5px 0 0}.traffic{display:flex;gap:5px;background:white;border:1px solid #ece8e7;border-radius:30px;padding:8px}.traffic i{width:10px;height:10px;border-radius:50%}.traffic i:nth-child(1){background:var(--red)}.traffic i:nth-child(2){background:var(--yellow)}.traffic i:nth-child(3){background:var(--green)}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 14px}.tab{border:1px solid #e6e3e1;background:#fff;border-radius:11px;padding:10px 2px;color:#86828a;font-weight:750}.tab.active{background:#262d3f;color:white;border-color:#262d3f}.tab.done:not(.active){color:#2b9461;background:#ecf8f0;border-color:#cbead5}.panel{background:white;border:1px solid #eae7e5;border-radius:20px;box-shadow:0 12px 35px #342a2209;padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:1.05rem;margin:0}.count{color:var(--muted);font-size:.8rem;font-weight:700}.instruction{color:#85818a;font-size:.83rem;margin:5px 0 17px}.rows{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow-y:auto;overscroll-behavior:contain}.row[hidden]{display:none}.row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}.cell{aspect-ratio:1;display:grid;place-items:center;border:1.5px solid #ebe8e7;border-radius:8px;background:#faf9f8;font-size:clamp(1rem,4vw,1.35rem);font-weight:800}.cell.filled{background:#fff;border-color:#bbb7ba}.cell.current{border-color:#8885a7;box-shadow:0 0 0 2px #8e88b221}.cell.red{background:#f7d5d4;color:#9a393d;border-color:#f2bebd}.cell.yellow{background:#faeab2;color:#8b6807;border-color:#f1db8e}.cell.green{background:#d1efdc;color:#207b4b;border-color:#b3e3c4}.legend{display:flex;justify-content:center;gap:16px;margin:15px 0;color:#8c8790;font-size:.73rem}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%}.status{text-align:center;font-size:.86rem;font-weight:750;color:#aa6264;min-height:1.35em;margin:10px 0}.status.success{color:#278658}.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.key{min-height:44px;border:1px solid #ebe7e4;background:#f8f7f6;color:#2e3547;border-radius:9px;font-size:1.05rem;font-weight:750}.key:active{transform:scale(.96);background:#e9e7e6}.key.action{background:#eceff6;color:#606a83}.key.submit{background:#32394d;color:white;border-color:#32394d;grid-column:span 2}.key:disabled{opacity:.45}.reset{display:block;margin:15px auto 0;border:0;background:none;color:#969099;font-size:.8rem;text-decoration:underline;text-underline-offset:3px}.help{text-align:center;font-size:.76rem;color:#aaa2a5;margin:15px 0 0}.empty{padding:8px 0;text-align:center;color:#bbb4b6;font-size:.8rem}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:420px){.shell{padding:16px 10px 30px}.panel{padding:16px 12px}.row{gap:3px}.cell{border-radius:6px}.legend{gap:9px}.key{min-height:44px}.tabs{gap:4px}.tab{font-size:.8rem}}
.shell[hidden],.access-screen[hidden]{display:none}.access-screen{min-height:100dvh;display:grid;place-items:center;padding:20px}.access-card{width:min(100%,360px);padding:30px 24px;border:1px solid #eae7e5;border-radius:20px;background:#fff;text-align:center;box-shadow:0 12px 35px #342a2209}.access-card h1{margin:0 0 8px;font-size:1.4rem}.access-card p{margin:0 0 20px;color:#7b8190}.access-card input{width:100%;height:52px;border:1px solid #ddd8d5;border-radius:11px;padding:0 14px;text-align:center;font:inherit;font-size:1.25rem;letter-spacing:.25em}.access-card button{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:11px;background:#32394d;color:#fff;font-weight:800}.access-error{min-height:22px;margin:8px 0 0!important;color:#b33e4a!important;font-size:.85rem}</style>
</head>
<body>
<section class="access-screen" id="accessScreen"><form class="access-card" id="accessForm"><h1>수식 신호등</h1><p>비밀번호를 입력해 주세요.</p><input id="accessCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="비밀번호" required><button type="submit">입장하기</button><p class="access-error" id="accessError" role="alert"></p></form></section>
<main class="shell" id="gameShell" hidden>
<header class="top"><div><div class="eyebrow">EQUATION TRAFFIC LIGHT</div><h1 class="title">수식 신호등</h1></div><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div></header>
<nav class="tabs" id="tabs" aria-label="문제 선택"></nav>
<section class="panel"><div class="panel-head"><h2 id="puzzleTitle">문제 1</h2><span class="count" id="count"></span></div><p class="instruction">9칸을 채워 숨겨진 수식을 맞혀 보세요.</p>
<div class="rows" id="history" aria-label="시도 기록"></div>
<div class="row" id="entry" aria-label="현재 입력"></div>
<div class="legend"><span><i style="background:var(--red)"></i>없음</span><span><i style="background:var(--yellow)"></i>위치 다름</span><span><i style="background:var(--green)"></i>위치 일치</span></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<div class="keypad" id="keypad" aria-label="수식 입력"></div>
<button class="reset" id="reset" type="button">이 문제 초기화</button>
</section><p class="help">제출할 때는 수식이 성립하지 않아도 괜찮아요.</p>
</main>
<script>
'use strict';
document.getElementById('accessForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('accessCode');if(input.value==='5555'){document.getElementById('accessScreen').hidden=true;document.getElementById('gameShell').hidden=false;input.value=''}else{document.getElementById('accessError').textContent='비밀번호가 틀렸어요.';input.value='';input.focus()}});
const answers=['40-3=37×1','12+8=10×2','81÷9=18÷2','13+7=10×2','45-9=18×2'];
const states=answers.map(()=>({input:'',history:[],done:false}));let current=0;
const $=id=>document.getElementById(id);
function score(guess,answer){const result=Array(9).fill('red'),remaining={};for(let i=0;i<9;i++){if(guess[i]===answer[i])result[i]='green';else remaining[answer[i]]=(remaining[answer[i]]||0)+1}for(let i=0;i<9;i++){if(result[i]==='green')continue;const c=guess[i];if(remaining[c]>0){result[i]='yellow';remaining[c]--}}return result}
function addCell(row,char,kind='',active=false){const cell=document.createElement('div');cell.className='cell'+(char&&!kind?' filled':'')+(kind?' '+kind:'')+(active?' current':'');cell.textContent=char||'';if(kind)cell.setAttribute('aria-label',char+' '+({red:'없음',yellow:'위치 다름',green:'위치 일치'}[kind]));row.appendChild(cell)}
function render(){const state=states[current];$('puzzleTitle').textContent='문제 '+(current+1);$('count').textContent='시도 '+state.history.length+'회';$('tabs').replaceChildren();states.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='tab'+(current===i?' active':'')+(s.done?' done':'');b.textContent=(i+1)+'번'+(s.done?' ✓':'');b.setAttribute('aria-pressed',String(i===current));b.onclick=()=>{current=i;render()};$('tabs').appendChild(b)});const history=$('history');history.replaceChildren();for(const attempt of state.history){const row=document.createElement('div');row.className='row';attempt.guess.split('').forEach((c,i)=>addCell(row,c,attempt.colors[i]));history.appendChild(row)}history.scrollTop=history.scrollHeight;const entry=$('entry');entry.replaceChildren();entry.hidden=state.done;for(let i=0;i<9;i++)addCell(entry,state.input[i]||'', '',i===state.input.length&&!state.done);$('status').className='status'+(state.done?' success':'');$('status').textContent=state.done?'정답! CLEAR 🎉':'';document.querySelectorAll('.key').forEach(b=>b.disabled=state.done)}
function insert(ch){const state=states[current];if(state.done||state.input.length>=9)return;state.input+=ch;render()}
function backspace(){const state=states[current];if(state.done)return;state.input=state.input.slice(0,-1);render()}
function submit(){const state=states[current];if(state.done)return;if(state.input.length!==9){$('status').textContent='9칸을 모두 채워 주세요.';return}const colors=score(state.input,answers[current]);state.history.push({guess:state.input,colors});state.input='';state.done=colors.every(c=>c==='green');render()}
const keys=['1','2','3','+','−','4','5','6','×','÷','7','8','9','=','^','0','지우기','제출'];for(const value of keys){const b=document.createElement('button');b.type='button';b.className='key'+(value==='지우기'?' action':value==='제출'?' submit':'');b.textContent=value;b.onclick=()=>{if(value==='지우기')backspace();else if(value==='제출')submit();else insert(value==='−'?'-':value)};$('keypad').appendChild(b)}
document.addEventListener('keydown',e=>{if(!$('accessScreen').hidden)return;if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;if(e.key==='Backspace'){e.preventDefault();backspace()}else if(e.key==='Enter'){if(e.target.tagName==='BUTTON')return;e.preventDefault();submit()}else{let c=({'*':'×','x':'×','X':'×','/':'÷','−':'-'})[e.key]||e.key;if(/^[0-9+\-=×÷^]$/.test(c)){e.preventDefault();insert(c)}}});
$('reset').addEventListener('click',()=>{states[current]={input:'',history:[],done:false};render()});render();
</script>
</body>
</html>
