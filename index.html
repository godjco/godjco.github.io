<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Personal Website</title>
  <style>
    :root {
      --ink: #18252b;
      --muted: #5d6b72;
      --paper: #fffaf2;
      --surface: #ffffff;
      --line: #d8ded9;
      --teal: #244855;
      --sage: #7ca69a;
      --coral: #e64833;
      --gold: #f1b84b;
      --shadow: 0 16px 40px rgba(24, 37, 43, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .skip-link {
      left: 1rem;
      padding: 0.65rem 0.85rem;
      position: absolute;
      top: -4rem;
      z-index: 20;
      background: var(--ink);
      color: white;
      border-radius: 0.5rem;
    }

    .skip-link:focus {
      top: 1rem;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(36, 72, 85, 0.12);
      background: rgba(255, 250, 242, 0.92);
      backdrop-filter: blur(14px);
    }

    .nav {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
      color: var(--teal);
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .nav-links a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      border-radius: 0.5rem;
      padding: 0 0.7rem;
    }
