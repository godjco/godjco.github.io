<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JH Park | Personal Website</title>
  <style>
    * { box-sizing: border-box; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2933;
      background: #f7f3ea;
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 243, 234, 0.95);
      border-bottom: 1px solid #ddd4c7;
      backdrop-filter: blur(10px);
    }
    nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-weight: 900;
      color: #244855;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
    }
    .nav-links a {
      color: #244855;
      text-decoration: none;
      font-weight: 700;
    }
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 72px 20px 44px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }
    .eyebrow {
      color: #e64833;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 13px;
    }
    h1 {
      margin: 10px 0 16px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.02;
      color: #244855;
    }
    h2 {
      margin: 0 0 18px;
      color: #244855;
      font-size: 30px;
    }
    h3 {
      margin: 0 0 8px;
      color: #244855;
    }
    .hero p {
      font-size: 18px;
      max-width: 620px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    .button {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      border: 2px solid #244855;
    }

      background: #244855;
      color: white;
